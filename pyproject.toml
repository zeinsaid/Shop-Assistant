[project]
name = "shop-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.143.0",
    "google-genai>=2.25.0",
    "openai>=3.20.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
